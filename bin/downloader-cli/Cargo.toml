[package]
name = "dc"
version = "0.2.0"
edition = "2021"
description = "Audio downloader: best quality audio with metadata, resumable parallel downloads"

[dependencies]
download-service.workspace = true
clap.workspace = true
tokio.workspace = true
anyhow.workspace = true
futures-util.workspace = true
indicatif = { version = "0.17.8", features = ["unicode-width"] }
console = { version = "0.15" }
# pure Rust, no image backend needed for terminal rendering
qrcode = { version = "0.14", default-features = false }
dirs = { version = "5" }
# full screen search picker (pure Rust, cross-platform incl. the Windows console)
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }

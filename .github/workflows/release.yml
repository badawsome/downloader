name: Tests and release

on:
  push:
    branches: [master]
  create:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to publish; leave empty for checks only"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: ${{ inputs.release_tag == '' && !startsWith(github.ref, 'refs/tags/') }}

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate and test
    if: github.event_name != 'create' || (github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v'))
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name || '') }}
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Record the exact source commit
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Validate release versions
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name || '') }}
        run: python .github/scripts/release.py validate
      - name: Check release tooling
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Verify the publishable crate
        run: cargo package -p source-api --locked

  build:
    name: ${{ matrix.platform.os_name }} with rust stable
    needs: validate
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os_name: FreeBSD-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-freebsd
            bin: dc
            name: dc-FreeBSD-x86_64.tar.gz
            skip_tests: true
          - os_name: Linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            bin: dc
            name: dc-Linux-x86_64-musl.tar.gz
          - os_name: Linux-aarch64
            os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            bin: dc
            name: dc-Linux-aarch64-musl.tar.gz
          - os_name: Linux-arm
            os: ubuntu-24.04
            target: arm-unknown-linux-musleabi
            bin: dc
            name: dc-Linux-arm-musl.tar.gz
          - os_name: Linux-i686
            os: ubuntu-24.04
            target: i686-unknown-linux-musl
            bin: dc
            name: dc-Linux-i686-musl.tar.gz
            skip_tests: true
          - os_name: Windows-i686
            os: windows-latest
            target: i686-pc-windows-msvc
            bin: dc.exe
            name: dc-Windows-i686.zip
            skip_tests: true
          - os_name: Windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: dc.exe
            name: dc-Windows-x86_64.zip
          - os_name: macOS-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bin: dc
            name: dc-Darwin-x86_64.tar.gz
          - os_name: macOS-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            bin: dc
            name: dc-Darwin-aarch64.tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native musl toolchain
        if: matrix.platform.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update --yes && sudo apt-get install --yes musl-tools
      - name: Build binary
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.platform.target }}
          toolchain: stable
          args: "--workspace --locked --release"
          strip: true
      - name: Run platform tests
        if: ${{ !matrix.platform.skip_tests }}
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: test
          target: ${{ matrix.platform.target }}
          toolchain: stable
          args: "--workspace --locked --release"
      - name: Package binary and checksum
        env:
          TARGET: ${{ matrix.platform.target }}
          BINARY: ${{ matrix.platform.bin }}
          ARCHIVE: ${{ matrix.platform.name }}
        run: python .github/scripts/release.py pack
      - uses: actions/upload-artifact@v4
        with:
          name: dc-${{ matrix.platform.os_name }}
          path: release-assets/*
          if-no-files-found: error

  publish-crate:
    name: Publish source-api to crates.io
    if: needs.validate.outputs.tag != ''
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package -p source-api --locked
      - name: Check whether this exact package was already published
        id: registry
        run: python .github/scripts/release.py registry
      - name: Check bootstrap credentials
        if: steps.registry.outputs.published != 'true'
        id: credentials
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            echo 'has_token=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_token=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate with crates.io Trusted Publishing
        if: steps.registry.outputs.published != 'true' && steps.credentials.outputs.has_token != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish crate
        if: steps.registry.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: cargo publish -p source-api --locked

  release:
    name: Publish GitHub Release
    if: needs.validate.outputs.tag != ''
    needs: [validate, build, publish-crate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: dc-*
          path: release-assets
          merge-multiple: true
      - name: Verify all platform archives and collect checksums
        run: python .github/scripts/release.py verify-assets --count 9
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ needs.validate.outputs.sha }}
          draft: false
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: release-assets/*

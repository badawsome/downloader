[workspace]
members = ["crates/*", "bin/*", "service/*"]
# unfinished
exclude = ["crates/facade"]
resolver = "2"

[workspace.package]
edition = "2021"
repository = "https://github.com/badawsome/downloader"

[workspace.dependencies]
# Everything here is pure Rust (TLS via rustls + ring, bundled webpki roots):
# no OpenSSL, FFmpeg, protoc or other system libraries are required.
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "gzip",
] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
thiserror = { version = "1" }
futures-util = { version = "0.3.30" }
anyhow = { version = "1" }

bili = { path = "crates/bili" }
media = { path = "crates/media" }
network-tools = { path = "crates/network-tools" }
bili-service = { path = "service/bili" }
